---
- project:
    name: l2switch-master
    jobs:
      # The odl-maven-jobs-jdk21 job-group is expanded inline here so that
      # gerrit-maven-merge alone can be disabled. l2switch publishes
      # SNAPSHOTs from GitHub Actions
      # (.github/workflows/gerrit-maven-merge.yaml) and running both CIs
      # double-publishes, advancing the SNAPSHOT buildNumber in
      # maven-metadata.xml from two places. Re-collapse to the job-group
      # if the GHA merge job is ever retired.
      - gerrit-maven-clm:
          nexus-iq-namespace: odl-
          nexus-iq-stage: release
          mvn-opts: "--add-opens java.base/java.util=ALL-UNNAMED"

      - gerrit-maven-merge:
          build-timeout: 180
          disable-job: true

      - gerrit-maven-stage:
          sbom-generator: true
          sign-artifacts: true
          cron: ""

      - gerrit-maven-mri-stage:
          sbom-generator: true
          sign-artifacts: true
          cron: ""

      - odl-maven-verify-jobs-jdk21:
          disable-job: true
      - gerrit-release-merge:
          build-node: ubuntu2204-docker-2c-2g

    # Supplied by the odl-maven-jobs-jdk21 job-group; expanding it inline
    # above drops them, which silently falls back to the global defaults
    # (openjdk11 / mvn35).
    java-version: openjdk21
    mvn-version: mvn39

    project: l2switch
    project-name: l2switch
    branch: master
    stream: master
    build-node: ubuntu2204-docker-4c-4g

    mvn-settings: "l2switch-settings"

    dependencies: >
      odlparent-merge-{stream},
      yangtools-merge-{stream},
      controller-merge-{stream},
      openflowjava-merge-{stream},
      openflowplugin-merge-{stream}
    email-upstream:
      "[l2switch] [odlparent] [yangtools] [controller] [openflowjava]\
      \ [openflowplugin]"

    # Used by the release job
    staging-profile-id: 96fee85953ca0

- project:
    name: l2switch-2.0.x
    jobs:
      - odl-maven-jobs-jdk21
      - odl-maven-verify-jobs-jdk21
      - gerrit-release-merge:
          build-node: ubuntu2204-docker-2c-2g

    project: l2switch
    project-name: l2switch
    branch: 2.0.x
    stream: 2.0.x
    build-node: ubuntu2204-docker-4c-4g

    mvn-settings: "l2switch-settings"

    dependencies: >
