---
- project:
    name: lispflowmapping-manganese
    jobs:
      - distribution-check-jobs-jdk21
      - odl-maven-javadoc-jobs-jdk21
      # The odl-maven-jobs-jdk21 job-group is expanded inline here so that
      # gerrit-maven-merge alone can be disabled. lispflowmapping publishes
      # SNAPSHOTs from GitHub Actions
      # (.github/workflows/gerrit-maven-merge.yaml) and running both CIs
      # double-publishes, advancing the SNAPSHOT buildNumber in
      # maven-metadata.xml from two places. Re-collapse to the job-group
      # if the GHA merge job is ever retired.
      - gerrit-maven-clm:
          nexus-iq-namespace: odl-
          nexus-iq-stage: release
          mvn-opts: "--add-opens java.base/java.util=ALL-UNNAMED"

      - gerrit-maven-merge:
          build-timeout: 180
          disable-job: true

      - gerrit-maven-stage:
          sbom-generator: true
          sign-artifacts: true
          cron: ""

      - gerrit-maven-mri-stage:
          sbom-generator: true
          sign-artifacts: true
          cron: ""

      - odl-maven-verify-jobs-jdk21:
          disable-job: true

    # Supplied by the odl-maven-jobs-jdk21 job-group; expanding it inline
    # above drops them, which silently falls back to the global defaults
    # (openjdk11 / mvn35).
    java-version: openjdk21
    mvn-version: mvn39

    stream: manganese
    project: "lispflowmapping"
    project-name: "lispflowmapping"
    branch: "master"
    build-node: ubuntu2204-docker-8c-8g
    mvn-settings: "lispflowmapping-settings"
    mvn-goals: "clean deploy -DrepoBuild"
    mvn-opts: "-Xmx2048m -Dmaven.compile.fork=true"
    dependencies: "controller-merge-{stream},odlparent-merge-{stream},yangtools-merge-{stream},neutron-merge-{stream}"
    email-upstream: "[lispflowmapping] [controller] [odlparent] [yangtools] [neutron]"
    archive-artifacts: >
      **/*.log
      **/target/surefire-reports/*-output.txt

    # Used by the release job
    staging-profile-id: 96fff2503b766

