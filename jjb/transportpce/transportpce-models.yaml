---
- project:
    name: transportpce-models-master
    jobs:
      # The odl-maven-jobs-jdk21 job-group is expanded inline here so that
      # gerrit-maven-merge alone can be disabled. transportpce/models
      # publishes SNAPSHOTs from GitHub Actions
      # (.github/workflows/gerrit-maven-merge.yaml) and running both CIs
      # double-publishes, advancing the SNAPSHOT buildNumber in
      # maven-metadata.xml from two places. Re-collapse to the job-group
      # if the GHA merge job is ever retired.
      - gerrit-maven-clm:
          nexus-iq-namespace: odl-
          nexus-iq-stage: release
          mvn-opts: "--add-opens java.base/java.util=ALL-UNNAMED"

      - gerrit-maven-merge:
          build-timeout: 180
          disable-job: true

      - gerrit-maven-stage:
          sbom-generator: true
          sign-artifacts: true
          cron: ""

      - gerrit-maven-mri-stage:
          sbom-generator: true
          sign-artifacts: true
          cron: ""

      - odl-maven-verify-jobs-jdk21

    # Supplied by the odl-maven-jobs-jdk21 job-group; expanding it inline
    # above drops them, which silently falls back to the global defaults
    # (openjdk11 / mvn35).
    java-version: openjdk21
    mvn-version: mvn39

    project: "transportpce/models"
    project-name: "transportpce-models"
    stream: master
    branch: "master"
    build-node: ubuntu2204-docker-2c-2g
    mvn-settings: "transportpce-settings"
    mvn-opts: "-Xmx1024m"
    dependencies: "odlparent-merge-{stream},yangtools-merge-{stream},controller-merge-{stream}"
    email-upstream: "[transportpce] [odlparent] [yangtools] [controller]"
    # Used by the release job
    staging-profile-id: a6927323fa3d4

