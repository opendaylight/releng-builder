---
- project:
    name: aaa-master
    jobs:
      # The odl-maven-jobs-jdk21 job-group is expanded inline here so that
      # gerrit-maven-merge alone can be disabled. aaa publishes SNAPSHOTs
      # from GitHub Actions (.github/workflows/gerrit-maven-merge.yaml) and
      # running both CIs double-publishes, corrupting the SNAPSHOT
      # buildNumber in maven-metadata.xml. Re-collapse to the job-group if
      # the GHA merge job is ever retired.
      - gerrit-maven-clm:
          nexus-iq-namespace: odl-
          nexus-iq-stage: release
          mvn-opts: "--add-opens java.base/java.util=ALL-UNNAMED"

      - gerrit-maven-merge:
          build-timeout: 180
          disable-job: true

      - gerrit-maven-stage:
          sbom-generator: true
          sign-artifacts: true
          cron: ""

      - gerrit-maven-mri-stage:
          sbom-generator: true
          sign-artifacts: true
          cron: ""

      - odl-maven-verify-jobs-jdk21:
          disable-job: true
      - gerrit-release-merge:
          build-node: ubuntu2204-docker-2c-2g
          build-timeout: 60

    project: aaa
    project-name: aaa
    branch: master
    stream: master
    build-node: ubuntu2204-docker-4c-4g

    mvn-settings: "aaa-settings"
    dependencies: "odlparent-merge-{stream},yangtools-merge-{stream},controller-merge-{stream}"
    email-upstream: "[aaa] [odlparent] [yangtools] [controller]"

    # Used by the release job
    staging-profile-id: 9318cf3c82c33

