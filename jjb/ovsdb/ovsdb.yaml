---
- project:
    name: ovsdb-manganese
    jobs:
      - distribution-check-jobs-jdk21
      - odl-maven-javadoc-jobs-jdk21
      # The odl-maven-jobs-jdk21 job-group is expanded inline here so that
      # gerrit-maven-merge alone can be disabled. ovsdb publishes master
      # SNAPSHOTs from GitHub Actions
      # (.github/workflows/gerrit-maven-merge.yaml) and running both CIs
      # double-publishes, advancing the SNAPSHOT buildNumber in
      # maven-metadata.xml from two places. Only this stream builds the
      # master branch; chromium, vanadium and titanium are untouched.
      # Re-collapse to the job-group if the GHA merge job is ever retired.
      - gerrit-maven-clm:
          nexus-iq-namespace: odl-
          nexus-iq-stage: release
          mvn-opts: "--add-opens java.base/java.util=ALL-UNNAMED"

      - gerrit-maven-merge:
          build-timeout: 180
          disable-job: true

      - gerrit-maven-stage:
          sbom-generator: true
          sign-artifacts: true
          cron: ""

      - gerrit-maven-mri-stage:
          sbom-generator: true
          sign-artifacts: true
          cron: ""

      - odl-maven-verify-jobs-jdk21:
          disable-job: true

    # Supplied by the odl-maven-jobs-jdk21 job-group; expanding it inline
    # above drops them, which silently falls back to the global defaults
    # (openjdk11 / mvn35).
    java-version: openjdk21
    mvn-version: mvn39

    stream: manganese
    project: "ovsdb"
    project-name: "ovsdb"
    branch: "master"
    build-node: ubuntu2204-docker-4c-4g
    mvn-settings: "ovsdb-settings"
    dependencies: "odlparent-merge-{stream},controller-merge-{stream},yangtools-merge-{stream}"
    email-upstream: "[ovsdb] [odlparent] [controller] [yangtools]"

    # Used by the release job
    staging-profile-id: a68b188166958

- project:
    name: ovsdb-chromium
    jobs:
      - distribution-check-jobs-jdk21
      - odl-maven-javadoc-jobs-jdk21
      - odl-maven-jobs-jdk21
      - odl-maven-verify-jobs-jdk21:
          disable-job: true

    stream: chromium
    project: "ovsdb"
    project-name: "ovsdb"
    branch: "stable/chromium"
    build-node: ubuntu2204-docker-4c-4g
    mvn-settings: "ovsdb-settings"
    dependencies: "odlparent-merge-{stream},controller-merge-{stream},yangtools-merge-{stream}"
