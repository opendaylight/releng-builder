---
- project:
    name: bgpcep-master
    jobs:
      - gerrit-tox-verify:
          parallel: true
      - odl-maven-javadoc-jobs-jdk21
      # The odl-maven-jobs-jdk21 job-group is expanded inline here so that
      # gerrit-maven-merge alone can be disabled. bgpcep publishes
      # SNAPSHOTs from GitHub Actions
      # (.github/workflows/gerrit-maven-merge.yaml) and running both CIs
      # double-publishes, advancing the SNAPSHOT buildNumber in
      # maven-metadata.xml from two places. Re-collapse to the job-group
      # if the GHA merge job is ever retired.
      - gerrit-maven-clm:
          nexus-iq-namespace: odl-
          nexus-iq-stage: release
          mvn-opts: "--add-opens java.base/java.util=ALL-UNNAMED"

      - gerrit-maven-merge:
          build-timeout: 180
          disable-job: true

      - gerrit-maven-stage:
          sbom-generator: true
          sign-artifacts: true
          cron: ""

      - gerrit-maven-mri-stage:
          sbom-generator: true
          sign-artifacts: true
          cron: ""

      - odl-maven-verify-jobs-jdk21:
          disable-job: true
      - gerrit-release-merge:
          build-node: ubuntu2204-docker-2c-2g
          build-timeout: 120

    # Supplied by the odl-maven-jobs-jdk21 job-group; expanding it inline
    # above drops them, which silently falls back to the global defaults
    # (openjdk11 / mvn35).
    java-version: openjdk21
    mvn-version: mvn39

    project: bgpcep
    project-name: bgpcep
    stream: master
    branch: master
    build-node: ubuntu2204-docker-8c-8g
    build-timeout: 120

    mvn-settings: "bgpcep-settings"
    dependencies: >
      odlparent-merge-{stream},
      yangtools-merge-{stream},
      controller-merge-{stream},
      mdsal-merge-{stream}
    email-upstream: "[bgpcep] [odlparent] [yangtools] [controller] [mdsal]"
    # Used by the release job
    staging-profile-id: 9427a05049030

- project:
    name: bgpcep-0.23.x
    jobs:
      - gerrit-tox-verify:
          parallel: true
      - odl-maven-javadoc-jobs-jdk21
      - odl-maven-jobs-jdk21
      - odl-maven-verify-jobs-jdk21
      - gerrit-release-merge:
          build-node: ubuntu2204-docker-2c-2g
          build-timeout: 120

    project: bgpcep
    project-name: bgpcep
    stream: 0.23.x
    branch: 0.23.x
    build-node: ubuntu2204-docker-8c-8g
    build-timeout: 120

    mvn-settings: "bgpcep-settings"
    dependencies: >
      odlparent-merge-{stream},
      yangtools-merge-{stream},
      controller-merge-{stream},
      mdsal-merge-{stream}
    email-upstream: "[bgpcep] [odlparent] [yangtools] [controller] [mdsal]"
    # Used by the release job
    staging-profile-id: 9427a05049030

- project:
    name: bgpcep-view
    views:
      - project-view
    project-name: bgpcep
