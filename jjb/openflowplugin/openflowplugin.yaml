---
- project:
    name: openflowplugin-manganese
    jobs:
      - odl-maven-javadoc-jobs-jdk21
      # The odl-maven-jobs-jdk21 job-group is expanded inline here so that
      # gerrit-maven-merge alone can be disabled. openflowplugin publishes master
      # SNAPSHOTs from GitHub Actions
      # (.github/workflows/gerrit-maven-merge.yaml) and running both CIs
      # double-publishes, advancing the SNAPSHOT buildNumber in
      # maven-metadata.xml from two places.
      # Only the manganese stream builds the master branch, so chromium,
      # titanium and vanadium are untouched.
      # Re-collapse to the job-group if the GHA merge job is ever retired.
      - gerrit-maven-clm:
          nexus-iq-namespace: odl-
          nexus-iq-stage: release
          mvn-opts: "--add-opens java.base/java.util=ALL-UNNAMED"

      - gerrit-maven-merge:
          build-timeout: 180
          disable-job: true

      - gerrit-maven-stage:
          sbom-generator: true
          sign-artifacts: true
          cron: ""

      - gerrit-maven-mri-stage:
          sbom-generator: true
          sign-artifacts: true
          cron: ""
      - odl-maven-verify-jobs-jdk21:
          disable-job: true
      - gerrit-release-merge:
          build-node: ubuntu2204-docker-2c-2g
          build-timeout: 90

    # Supplied by the odl-maven-jobs-jdk21 job-group; expanding it inline
    # above drops them, which silently falls back to the global defaults
    # (openjdk11 / mvn35).
    java-version: openjdk21
    mvn-version: mvn39

    stream: manganese
    project: "openflowplugin"
    project-name: "openflowplugin"
    branch: "master"
    build-node: ubuntu2204-docker-4c-4g
    build-timeout: 90
    mvn-settings: "openflowplugin-settings"
    mvn-goals: "clean deploy javadoc:aggregate"
    dependencies: >
      odlparent-merge-{stream},
      yangtools-merge-{stream},
      controller-merge-{stream},
      openflowjava-merge-{stream}
    email-upstream: "[openflowplugin] [odlparent] [yangtools] [controller] [openflowjava]"
    # Used by the release job
    staging-profile-id: a68a76dc1b44c

