---
- project:
    name: ietf-master
    jobs:
      # The odl-maven-jobs-jdk21 job-group is expanded inline here so that
      # gerrit-maven-merge alone can be disabled. ietf publishes SNAPSHOTs
      # from GitHub Actions (.github/workflows/gerrit-maven-merge.yaml) and
      # running both CIs double-publishes, advancing the SNAPSHOT
      # buildNumber in maven-metadata.xml from two places. Re-collapse to
      # the job-group if the GHA merge job is ever retired.
      - gerrit-maven-clm:
          nexus-iq-namespace: odl-
          nexus-iq-stage: release
          mvn-opts: "--add-opens java.base/java.util=ALL-UNNAMED"

      - gerrit-maven-merge:
          build-timeout: 180
          disable-job: true

      - gerrit-maven-stage:
          sbom-generator: true
          sign-artifacts: true
          cron: ""

      - gerrit-maven-mri-stage:
          sbom-generator: true
          sign-artifacts: true
          cron: ""

      - odl-maven-verify-jobs-jdk21:
          disable-job: true
      - gerrit-release-merge:
          build-node: ubuntu2204-docker-2c-2g
          build-timeout: 120

    # Supplied by the odl-maven-jobs-jdk21 job-group; expanding it inline
    # above drops them, which silently falls back to the global defaults
    # (openjdk11 / mvn35).
    java-version: openjdk21
    mvn-version: mvn39

    project: ietf
    project-name: ietf
    branch: master
    stream: master
    build-node: ubuntu2204-docker-4c-4g

    mvn-settings: "ietf-settings"
    build-timeout: 60

    # Used by the release job
    staging-profile-id: ca996fb20812d1

- project:
    name: ietf-1.0.x
    jobs:
      - odl-maven-jobs-jdk21
      - odl-maven-verify-jobs-jdk21
      - gerrit-release-merge:
          build-node: ubuntu2204-docker-2c-2g
          build-timeout: 120

    project: ietf
    project-name: ietf
    branch: 1.0.x
    stream: vanadium
    build-node: ubuntu2204-docker-4c-4g

    mvn-settings: "ietf-settings"
    build-timeout: 60

    # Used by the release job
    staging-profile-id: ca996fb20812d1

- project:
    name: ietf-view
    views:
      - project-view
    project-name: ietf
