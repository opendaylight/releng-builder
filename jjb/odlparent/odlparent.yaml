---
- project:
    name: odlparent-master
    jobs:
      # The odl-maven-jobs-jdk21 job-group is expanded inline here so that
      # gerrit-maven-merge alone can be disabled. odlparent publishes
      # SNAPSHOTs from GitHub Actions
      # (.github/workflows/gerrit-maven-merge.yaml) and running both CIs
      # double-publishes, advancing the SNAPSHOT buildNumber in
      # maven-metadata.xml from two places. Re-collapse to the job-group
      # if the GHA merge job is ever retired.
      - gerrit-maven-clm:
          nexus-iq-namespace: odl-
          nexus-iq-stage: release
          mvn-opts: "--add-opens java.base/java.util=ALL-UNNAMED"

      - gerrit-maven-merge:
          build-timeout: 180
          disable-job: true

      - gerrit-maven-stage:
          sbom-generator: true
          sign-artifacts: true
          cron: ""

      - gerrit-maven-mri-stage:
          sbom-generator: true
          sign-artifacts: true
          cron: ""

      - odl-maven-verify-jobs-jdk21:
          disable-job: true
      - gerrit-tox-verify
      - gerrit-release-merge:
          build-node: ubuntu2204-docker-2c-2g

    project: odlparent
    project-name: odlparent
    stream: master
    branch: master
    build-node: ubuntu2204-docker-2c-2g

    # Supplied by the odl-maven-jobs-jdk21 job-group; expanding it inline
    # above drops them, which silently falls back to the global defaults
    # (openjdk11 / mvn35).
    java-version: openjdk21
    mvn-version: mvn39

    mvn-settings: odlparent-settings

    dependencies: ""
    email-upstream: "[odlparent]"
    archive-artifacts: >
      **/*.prop
      **/*.log
      **/target/surefire-reports/*-output.txt
      **/target/failsafe-reports/failsafe-summary.xml
      **/hs_err_*.log
      **/target/feature/feature.xml

    # Used by the release job
    staging-profile-id: 880d5ac25eaa

- project:
    name: odlparent-14.3.x
    jobs:
      - odl-maven-jobs-jdk21
      - odl-maven-verify-jobs-jdk21:
          disable-job: true
      - gerrit-tox-verify
      - gerrit-release-merge:
          build-node: ubuntu2204-docker-2c-2g

    project: odlparent
    project-name: odlparent
    stream: 14.3.x
    branch: 14.3.x
    build-node: ubuntu2204-docker-2c-2g

    mvn-settings: odlparent-settings

    dependencies: ""
    email-upstream: "[odlparent]"
    archive-artifacts: >
      **/*.prop
      **/*.log
      **/target/surefire-reports/*-output.txt
      **/target/failsafe-reports/failsafe-summary.xml
      **/hs_err_*.log
      **/target/feature/feature.xml

    # Used by the release job
    staging-profile-id: 880d5ac25eaa

- project:
    name: odlparent-view
    views:
      - project-view
    project-name: odlparent
