---
- project:
    name: netconf-master
    jobs:
      - gerrit-tox-verify:
          build-node: ubuntu2204-builder-2c-2g
          parallel: true
      # The odl-maven-jobs-jdk21 job-group is expanded inline here so that
      # gerrit-maven-merge alone can be disabled. netconf publishes master
      # SNAPSHOTs from GitHub Actions
      # (.github/workflows/gerrit-maven-merge.yaml) and running both CIs
      # double-publishes, advancing the SNAPSHOT buildNumber in
      # maven-metadata.xml from two places.
      # Re-collapse to the job-group if the GHA merge job is ever retired.
      - gerrit-maven-clm:
          nexus-iq-namespace: odl-
          nexus-iq-stage: release
          mvn-opts: "--add-opens java.base/java.util=ALL-UNNAMED"

      - gerrit-maven-merge:
          build-timeout: 180
          disable-job: true

      - gerrit-maven-stage:
          sbom-generator: true
          sign-artifacts: true
          cron: ""

      - gerrit-maven-mri-stage:
          sbom-generator: true
          sign-artifacts: true
          cron: ""
      - odl-maven-verify-jobs-jdk21:
          disable-job: true
      - gerrit-release-merge:
          build-node: ubuntu2204-docker-2c-2g
          build-timeout: 120

    # Supplied by the odl-maven-jobs-jdk21 job-group; expanding it inline
    # above drops them, which silently falls back to the global defaults
    # (openjdk11 / mvn35).
    java-version: openjdk21
    mvn-version: mvn39

    project: netconf
    project-name: netconf
    stream: master
    branch: master
    build-node: ubuntu2204-docker-4c-4g
    build-timeout: 90

    mvn-settings: "netconf-settings"
    mvn-goals: "clean deploy -Pintegrationtests"
    karaf-version: "netconf"

    dependencies: "aaa-merge-{stream},controller-merge-{stream},odlparent-merge-{stream},yangtools-merge-{stream}"
    email-upstream: "[netconf] [aaa] [controller] [odlparent] [yangtools]"

    # Used by the release job
    staging-profile-id: a67b22fc3663f

