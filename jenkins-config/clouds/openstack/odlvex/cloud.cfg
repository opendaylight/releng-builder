# Cloud Configuration
CLOUD_CREDENTIAL_ID=os-cloud
CLOUD_URL=https://auth.vexxhost.net/v3
CLOUD_IGNORE_SSL=false
CLOUD_ZONE=ca-ymq-1

# Default Template Configuration
IMAGE_NAME=ZZCI - Ubuntu 22.04 - builder - x86_64 - 20261001-010126.490
AVAILABILITY_ZONE=
HARDWARE_ID=v3-standard-2
NETWORK_ID=b5fcd86e-efac-4997-b8bc-dbe0d35bc229
USER_DATA_ID=jenkins-init-script
# INSTANCE_CAP caps agents by count, but the tenant's binding constraint is
# RAM (quota 1000000 MB; every v3-standard flavor is 4096 MB/core). Across the
# 41 agent templates the average flavor is ~15884 MB, so 75 agents reserve
# ~1163 GB -- more than the whole quota -- before any CSIT heat stack exists.
# CSIT stacks are created by "lftools openstack stack create" and are not
# counted against this cap, so the quota ends up arbitrating by returning
# HTTP 403 on stack create, which fails the build instead of queueing it.
# 45 agents reserve ~715 GB and leave ~260 GB for CSIT stacks, matching
# observed steady-state stack usage. Raise this if the build queue grows
# while totalRAMUsed stays well under quota.
INSTANCE_CAP=45
SANDBOX_CAP=8
FLOATING_IP_POOL=
SECURITY_GROUPS=default
START_TIMEOUT=600000
KEY_PAIR_NAME=jenkins-ssh
NUM_EXECUTORS=1
JVM_OPTIONS=
FS_ROOT=/w
RETENTION_TIME=0
