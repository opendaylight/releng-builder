LABELS=ubuntu2404-robot-2c-8g
IMAGE_NAME=ZZCI - Ubuntu 24.04 - robot - x86_64 - 20261001-014553.551
HARDWARE_ID=v3-standard-2
# CSIT jobs run here, and each one creates a heat stack via "lftools
# openstack stack create" after it claims an agent. Those stacks are not
# Jenkins agents, so the cloud-wide INSTANCE_CAP in cloud.cfg does not
# count them -- it caps this pool but not the RAM each member goes on to
# allocate. The three active streams (manganese, chromium, titanium)
# trigger 20 CSIT jobs each and overlap daily around 00:50-02:30 UTC, so
# 60 jobs contend for one 1000000 MB tenant quota. Measured on 2026-10-19
# they allocated 1664 GB of stacks and 19 of the 60 died on
# "Quota exceeded for ram" (HTTP 403); the stream that started last lost.
# Capping this template bounds concurrent stacks 1:1: 20 agents reserve
# ~160 GB and their stacks ~600 GB, leaving ~215 GB for builder/docker
# agents. Raise this if CSIT queues while totalRAMUsed stays under quota.
INSTANCE_CAP=20
