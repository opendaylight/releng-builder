---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation
#
# GHA replacement for the daexim CSIT jobs currently generated by JJB from
#   jjb/daexim/daexim-csit-basic.yaml            (inttest-csit-1node)
#   jjb/daexim/daexim-csit-clustering-basic.yaml (inttest-csit-3node)
#
# Both need no mininet (tools_system_count: 0), so they run on the docker
# backend with no OpenStack involvement.

name: daexim CSIT

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
    inputs:
      stream:
        description: "Single stream to run, or 'all'"
        required: false
        default: "vanadium"
        type: choice
        options: [all, manganese, chromium, vanadium]
      functionality:
        description: "Which suite set to run"
        required: false
        default: "basic"
        type: choice
        options: [all, basic, clustering-basic]
  schedule:
    # Jenkins ran these off a reverse trigger from the distribution build.
    # Nightly is the closest lazy equivalent until distribution moves to GHA.
    - cron: "0 4 * * *"

permissions:
  contents: read

jobs:
  matrix:
    name: Build job matrix
    runs-on: ubuntu-24.04
    outputs:
      jobs: ${{ steps.build.outputs.jobs }}
    steps:
      - name: Select jobs
        id: build
        env:
          STREAM: ${{ inputs.stream || 'all' }}
          FUNC: ${{ inputs.functionality || 'all' }}
        run: |
          # Mirrors the JJB `stream:` and `jobs:` lists for daexim.
          all='[
            {"functionality":"basic","odl_nodes":1,"stream":"manganese","branch":"master"},
            {"functionality":"basic","odl_nodes":1,"stream":"chromium","branch":"stable/chromium"},
            {"functionality":"basic","odl_nodes":1,"stream":"vanadium","branch":"stable/vanadium"},
            {"functionality":"clustering-basic","odl_nodes":3,"stream":"manganese","branch":"master"},
            {"functionality":"clustering-basic","odl_nodes":3,"stream":"chromium","branch":"stable/chromium"},
            {"functionality":"clustering-basic","odl_nodes":3,"stream":"vanadium","branch":"stable/vanadium"}
          ]'
          jobs=$(echo "$all" | jq -c \
            --arg s "$STREAM" --arg f "$FUNC" \
            '[ .[] | select($s == "all" or .stream == $s)
                   | select($f == "all" or .functionality == $f) ]')
          echo "jobs=$jobs" >> "$GITHUB_OUTPUT"
          echo "$jobs" | jq .

  csit:
    needs: matrix
    if: needs.matrix.outputs.jobs != '[]'
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJson(needs.matrix.outputs.jobs) }}
    uses: ./.github/workflows/csit-run.yaml
    with:
      project: daexim
      functionality: ${{ matrix.job.functionality }}
      stream: ${{ matrix.job.stream }}
      branch: ${{ matrix.job.branch }}
      odl-nodes: ${{ matrix.job.odl_nodes }}
      tools-nodes: 0
      controller-scope: only
      install-features: "odl-daexim-all,odl-netconf-topology,odl-jolokia"
