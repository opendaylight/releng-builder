---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation
#
# GENERATED by ci-tools/generate-csit-workflows.py from the expanded JJB job
# XML. Do not edit by hand: change jjb/distribution/ and regenerate.
#
# Replaces 1 Jenkins job(s) built from jjb/distribution/*.yaml.
# The job list lives in .github/csit/distribution.json.

name: distribution CSIT

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
    inputs:
      stream:
        description: "Single stream to run, or 'all'"
        required: false
        default: "silicon"
        type: choice
        options: [all, silicon]
      functionality:
        description: "Single functionality to run, or 'all'"
        required: false
        default: "all"
        type: string
  schedule:
    # Jenkins triggered these from the distribution build; nightly is the
    # closest equivalent until distribution itself moves to GHA.
    - cron: "0 6 * * *"

permissions:
  contents: read

jobs:
  matrix:
    name: Build job matrix
    runs-on: ubuntu-24.04
    outputs:
      jobs: ${{ steps.build.outputs.jobs }}
    steps:
      - name: Checkout releng/builder
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0

      - name: Select jobs
        id: build
        env:
          STREAM: ${{ inputs.stream || 'all' }}
          FUNC: ${{ inputs.functionality || 'all' }}
        run: |
          jobs=$(jq -c --arg s "$STREAM" --arg f "$FUNC" \
            '[ .[] | select($s == "all" or .stream == $s)
                   | select($f == "all" or .functionality == $f) ]' \
            .github/csit/distribution.json)
          echo "jobs=$jobs" >> "$GITHUB_OUTPUT"
          echo "$jobs" | jq -r '.[].job'

  csit:
    needs: matrix
    if: needs.matrix.outputs.jobs != '[]'
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJson(needs.matrix.outputs.jobs) }}
    uses: ./.github/workflows/csit-run.yaml
    with:
      project: distribution
      functionality: ${{ matrix.job.functionality }}
      stream: ${{ matrix.job.stream }}
      branch: ${{ matrix.job.branch }}
      odl-nodes: ${{ matrix.job.odl_nodes }}
      tools-nodes: ${{ matrix.job.tools_nodes }}
      bundle-url: ${{ matrix.job['bundle-url'] || 'last' }}
      controller-max-mem: ${{ matrix.job['controller-max-mem'] || '2048m' }}
      controller-scope: ${{ matrix.job['controller-scope'] || 'only' }}
      debug-map: ${{ matrix.job['debug-map'] || '' }}
      elasticsearch-attribute: ${{ matrix.job['elasticsearch-attribute'] || 'disabled' }}
      install-features: ${{ matrix.job['install-features'] || '' }}
      jdk-version: ${{ matrix.job['jdk-version'] || 'openjdk21' }}
      karaf-version: ${{ matrix.job['karaf-version'] || 'karaf4' }}
      robot-options: ${{ matrix.job['robot-options'] || '' }}
      suites: ${{ matrix.job['suites'] || '' }}
      use-features-boot: ${{ matrix.job['use-features-boot'] || 'True' }}
