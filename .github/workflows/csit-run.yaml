---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation
#
# Reusable CSIT engine. One call == one JJB CSIT job.
#
# Replaces the inttest-csit-1node / inttest-csit-3node JJB job templates.
# The CSIT logic itself is NOT reimplemented here: jjb/integration/*.sh and
# common-functions.sh remain the single source of truth and are executed
# unmodified by lfreleng-actions/csit-build-action.

name: CSIT Run

# yamllint disable-line rule:truthy
on:
  workflow_call:
    inputs:
      project:
        description: "ODL project under test, e.g. daexim"
        required: true
        type: string
      functionality:
        description: "Functionality under test, e.g. basic"
        required: true
        type: string
      stream:
        description: "Stream name (DISTROSTREAM), e.g. chromium"
        required: true
        type: string
      branch:
        description: "Distribution/project branch the bundle is built from (DISTROBRANCH)"
        required: true
        type: string
      test-ref:
        description: >-
          integration/test ref. The JJB templates always check out master
          (PATCHREFSPEC), independent of the stream under test.
        required: false
        default: "master"
        type: string
      odl-nodes:
        description: "Controller node count"
        required: false
        default: 1
        type: number
      tools-nodes:
        description: "Tools/mininet node count"
        required: false
        default: 0
        type: number
      install-features:
        description: "Comma separated karaf features"
        required: false
        default: ""
        type: string
      controller-scope:
        description: "'only' or 'all'"
        required: false
        default: "only"
        type: string
      controller-max-mem:
        description: "Karaf max heap"
        required: false
        default: "2048m"
        type: string
      karaf-version:
        description: "karaf4 | netconf | bgpcep"
        required: false
        default: "karaf4"
        type: string
      jdk-version:
        description: "JDK used to run karaf"
        required: false
        default: "openjdk21"
        type: string
      robot-options:
        description: "Extra robot options"
        required: false
        default: ""
        type: string
      debug-map:
        description: "Karaf debug map"
        required: false
        default: ""
        type: string
      use-features-boot:
        description: "Append features to featuresBoot"
        required: false
        default: "True"
        type: string
      elasticsearch-attribute:
        description: "JVM metric harvesting, or 'disabled'"
        required: false
        default: "disabled"
        type: string
      bundle-url:
        description: "Distribution zip URL, or 'last'"
        required: false
        default: "last"
        type: string
      suites:
        description: "Space separated suites overriding the test plan"
        required: false
        default: ""
        type: string
      runs-on:
        description: "Runner label"
        required: false
        default: "ubuntu-24.04"
        type: string
      timeout-minutes:
        description: "Job timeout"
        required: false
        default: 360
        type: number

permissions:
  contents: read

jobs:
  csit:
    name: ${{ inputs.project }}-csit-${{ inputs.odl-nodes }}node-${{ inputs.functionality }}-${{ inputs.stream }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - name: Checkout releng/builder
        # yamllint disable-line rule:line-length
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          submodules: true

      - name: Checkout integration/test
        # yamllint disable-line rule:line-length
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: opendaylight/integration-test
          ref: ${{ inputs.test-ref }}
          path: test

      - name: Run CSIT
        id: csit
        # yamllint disable-line rule:line-length
        uses: askb/csit-build-action@main # ponytail: becomes lfreleng-actions/csit-build-action once proven
        with:
          mode: run
          backend: docker
          odl-nodes: ${{ inputs.odl-nodes }}
          tools-nodes: ${{ inputs.tools-nodes }}
          csit-scripts-dir: jjb/integration
          lf-env: global-jjb/jenkins-init-scripts/lf-env.sh
          test-dir: test
          bundle-url: ${{ inputs.bundle-url }}
          karaf-version: ${{ inputs.karaf-version }}
          jdk-version: ${{ inputs.jdk-version }}
          distribution-branch: ${{ inputs.branch }}
          distribution-stream: ${{ inputs.stream }}
          install-features: ${{ inputs.install-features }}
          controller-scope: ${{ inputs.controller-scope }}
          controller-max-mem: ${{ inputs.controller-max-mem }}
          debug-map: ${{ inputs.debug-map }}
          use-features-boot: ${{ inputs.use-features-boot }}
          elasticsearch-attribute: ${{ inputs.elasticsearch-attribute }}
          script-plan: ${{ inputs.project }}.txt
          config-plan: ${{ inputs.project }}.txt
          stream-test-plan: >-
            ${{ inputs.project }}-${{ inputs.functionality }}-${{ inputs.stream }}.txt
          test-plan: ${{ inputs.project }}-${{ inputs.functionality }}.txt
          suites: ${{ inputs.suites }}
          robot-options: ${{ inputs.robot-options }}

      - name: Publish robot report
        if: always()
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # yamllint disable-line rule:line-length
          name: csit-${{ inputs.project }}-${{ inputs.functionality }}-${{ inputs.stream }}
          path: |
            output.xml
            log.html
            report.html
            *.log
            *.log.gz
            gclogs-*/
          if-no-files-found: warn
          retention-days: 30
