---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation
#
# The one reusable CSIT engine. One matrix entry == one JJB CSIT job.
#
# Replaces the inttest-csit-1node / inttest-csit-3node JJB job templates, and
# the Jenkins fan-out itself: Jenkins used `trigger-builds ... block: true` to
# start N CSIT jobs and wait, which here is just a matrix in a called workflow
# (blocking and failure propagation come for free).
#
# The CSIT logic is NOT reimplemented here. jjb/integration/*.sh and
# common-functions.sh remain the single source of truth and are executed
# unmodified by csit-build-action.
#
# Job entries come from .github/csit/csit-jobs.json via
# ci-tools/select-csit-jobs.py. Defaults below mirror jjb/defaults.yaml, so an
# entry only carries the fields where it differs.

name: CSIT Run

# yamllint disable-line rule:truthy
on:
  workflow_call:
    inputs:
      jobs:
        description: >-
          JSON array of CSIT job objects, as produced by
          ci-tools/select-csit-jobs.py.
        required: true
        type: string
      bundle-url:
        description: "Distribution zip URL, or 'last' to resolve from Nexus"
        required: false
        default: "last"
        type: string
      test-ref:
        description: >-
          integration/test ref. The JJB templates always check out master
          (PATCHREFSPEC), independent of the stream under test.
        required: false
        default: "master"
        type: string
      runs-on:
        description: "Runner label"
        required: false
        default: "ubuntu-24.04"
        type: string
      timeout-minutes:
        description: "Fallback per-job timeout, when the job carries none"
        required: false
        default: 360
        type: number
      artifact-pattern:
        description: >-
          Which result artifacts the report job downloads. A project caller
          narrows this to its own jobs so it does not pull every other
          project's logs out of the same run.
        required: false
        default: "*"
        type: string
      report-title:
        description: >-
          Names the published report. Each deploy replaces the whole site,
          so this is how a reader tells which pipeline the page shows.
        required: false
        default: ""
        type: string
      publish-pages:
        description: >-
          Publish the go/no-go table to GitHub Pages. Only the workflow that
          owns the whole fan-out may set this: deploy-pages replaces the
          entire site, so two callers in one run would overwrite each other.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  csit:
    name: ${{ matrix.job.job }}
    runs-on: ${{ inputs.runs-on }}
    # Jenkins sets build-timeout per job: 360 for most, but 480/720/1440/1500
    # for benchmark, scale and longevity jobs. GitHub-hosted runners stop any
    # job at 6h, so the 19 jobs above that ceiling cannot complete on them --
    # they fail on time and the robot gate reports "no results" rather than a
    # truncated pass. Tracked as a known exclusion, not silently clamped.
    timeout-minutes: ${{ matrix.job['timeout-minutes'] || inputs.timeout-minutes }}
    strategy:
      fail-fast: false
      # Jenkins ran these on a large static agent pool. Cap the burst so one
      # stream does not starve every other workflow in the org.
      max-parallel: 20
      matrix:
        job: ${{ fromJSON(inputs.jobs) }}
    steps:
      - name: Checkout releng/builder
        # yamllint disable-line rule:line-length
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          submodules: true

      - name: Checkout integration/test
        # yamllint disable-line rule:line-length
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: opendaylight/integration-test
          ref: ${{ inputs.test-ref }}
          path: test

      - name: Run CSIT
        id: csit
        # yamllint disable-line rule:line-length
        uses: askb/csit-build-action@main # ponytail: becomes lfreleng-actions/csit-build-action once proven
        with:
          mode: run
          backend: docker
          job-name: ${{ matrix.job.job }}
          odl-nodes: ${{ matrix.job.odl_nodes }}
          tools-nodes: ${{ matrix.job.tools_nodes }}
          csit-scripts-dir: jjb/integration
          lf-env: global-jjb/jenkins-init-scripts/lf-env.sh
          test-dir: test
          bundle-url: ${{ matrix.job['bundle-url'] || inputs.bundle-url }}
          karaf-version: ${{ matrix.job['karaf-version'] || 'karaf4' }}
          jdk-version: ${{ matrix.job['jdk-version'] || 'openjdk21' }}
          distribution-branch: ${{ matrix.job.branch }}
          distribution-stream: ${{ matrix.job.stream }}
          install-features: ${{ matrix.job['install-features'] }}
          controller-scope: ${{ matrix.job['controller-scope'] || 'only' }}
          controller-max-mem: ${{ matrix.job['controller-max-mem'] || '2048m' }}
          debug-map: ${{ matrix.job['debug-map'] }}
          use-features-boot: ${{ matrix.job['use-features-boot'] || 'True' }}
          # yamllint disable-line rule:line-length
          elasticsearch-attribute: ${{ matrix.job['elasticsearch-attribute'] || 'disabled' }}
          script-plan: ${{ matrix.job.project }}.txt
          config-plan: ${{ matrix.job.project }}.txt
          stream-test-plan: >-
            ${{ matrix.job.project }}-${{ matrix.job.functionality }}-${{ matrix.job.stream }}.txt
          test-plan: ${{ matrix.job.project }}-${{ matrix.job.functionality }}.txt
          suites: ${{ matrix.job['suites'] }}
          robot-options: ${{ matrix.job['robot-options'] }}

      - name: Publish robot report
        if: always()
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.job.job }}
          path: |
            output.xml
            log.html
            report.html
            *.log
            *.log.gz
            gclogs-*/
          if-no-files-found: warn
          retention-days: 30

  # Jenkins showed a verdict per job via the Robot plugin and mailed the
  # project. Whether an ODL release ships is a community decision, so the
  # fan-out needs one readable page, and it must list a job that produced
  # nothing rather than quietly leaving it out.
  report:
    name: Report
    needs: csit
    if: always()
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
      pages: write
    steps:
      - name: Download job results
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: results
          pattern: ${{ inputs.artifact-pattern }}

      - name: Render summary
        # yamllint disable-line rule:line-length
        uses: askb/csit-build-action@main # ponytail: becomes lfreleng-actions/csit-build-action once proven
        with:
          mode: report
          results-dir: results
          expected-jobs: ${{ inputs.jobs }}
          html-dir: ${{ inputs.publish-pages && 'site' || '' }}
          title: ${{ inputs.report-title || github.workflow }}

      - name: Configure Pages
        if: inputs.publish-pages
        # yamllint disable-line rule:line-length
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        if: inputs.publish-pages
        # yamllint disable-line rule:line-length
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  # Separate job on purpose: id-token: write mints an OIDC token, and that
  # must not sit on the job that downloads and unpacks 148 jobs' output.
  deploy:
    name: Publish report
    needs: report
    # always(): a failed CSIT job must not suppress the release report. That
    # report exists to show failures, so publishing it only on a green run
    # would hide exactly the runs a reader needs. Without always() GitHub
    # skips this job whenever anything upstream of `report` failed.
    if: always() && inputs.publish-pages && needs.report.result == 'success'
    runs-on: ${{ inputs.runs-on }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        # yamllint disable-line rule:line-length
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
