---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation
#
# GHA replacement for the l2switch CSIT jobs generated by JJB from
#   jjb/l2switch/l2switch-csit-switch.yaml  (inttest-csit-1node)
#
# These need mininet, so they exercise the tools node container (Open vSwitch
# on the kernel datapath). Still no OpenStack.

name: l2switch CSIT

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
    inputs:
      stream:
        description: "Single stream to run, or 'all'"
        required: false
        default: "vanadium"
        type: choice
        options: [all, manganese, chromium, vanadium]
  schedule:
    - cron: "0 5 * * *"

permissions:
  contents: read

jobs:
  matrix:
    name: Build job matrix
    runs-on: ubuntu-24.04
    outputs:
      jobs: ${{ steps.build.outputs.jobs }}
    steps:
      - name: Select jobs
        id: build
        env:
          STREAM: ${{ inputs.stream || 'all' }}
        run: |
          # Mirrors the JJB `stream:` list for l2switch-csit-switch.
          all='[
            {"stream":"manganese","branch":"master","jdk":"openjdk21"},
            {"stream":"chromium","branch":"stable/chromium","jdk":"openjdk21"},
            {"stream":"vanadium","branch":"stable/vanadium","jdk":"openjdk21"}
          ]'
          jobs=$(echo "$all" | jq -c --arg s "$STREAM" \
            '[ .[] | select($s == "all" or .stream == $s) ]')
          echo "jobs=$jobs" >> "$GITHUB_OUTPUT"
          echo "$jobs" | jq .

  csit:
    needs: matrix
    if: needs.matrix.outputs.jobs != '[]'
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJson(needs.matrix.outputs.jobs) }}
    uses: ./.github/workflows/csit-run.yaml
    with:
      project: l2switch
      functionality: switch
      stream: ${{ matrix.job.stream }}
      branch: ${{ matrix.job.branch }}
      jdk-version: ${{ matrix.job.jdk }}
      odl-nodes: 1
      tools-nodes: 1
      controller-scope: all
      install-features: "odl-l2switch-switch-ui"
      robot-options: "-v TOPO_TREE_DEPTH:5"
